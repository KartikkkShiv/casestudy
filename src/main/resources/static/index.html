<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Brightline HR — API Monitoring Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS Custom Properties (Material Design 3) ===== */
        :root {
            /* Light theme */
            --md-sys-color-surface: #fffbfe;
            --md-sys-color-surface-dim: #f3eff4;
            --md-sys-color-surface-bright: #fffbfe;
            --md-sys-color-surface-container-lowest: #ffffff;
            --md-sys-color-surface-container-low: #f7f2f7;
            --md-sys-color-surface-container: #f1ecf1;
            --md-sys-color-surface-container-high: #ebe6eb;
            --md-sys-color-surface-container-highest: #e6e0e6;
            --md-sys-color-on-surface: #1c1b1f;
            --md-sys-color-on-surface-variant: #49454e;
            --md-sys-color-outline: #79747e;
            --md-sys-color-outline-variant: #cac7d0;
            --md-sys-color-scrim: #000000;
            --md-sys-color-inverse-surface: #313033;
            --md-sys-color-inverse-on-surface: #f4eff4;
            --md-sys-color-inverse-primary: #d0bcff;
            --md-sys-color-primary: #6750a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #eaddff;
            --md-sys-color-on-primary-container: #21005e;
            --md-sys-color-secondary: #625b71;
            --md-sys-color-on-secondary: #ffffff;
            --md-sys-color-secondary-container: #e8def8;
            --md-sys-color-on-secondary-container: #1e192b;
            --md-sys-color-tertiary: #7d5260;
            --md-sys-color-on-tertiary: #ffffff;
            --md-sys-color-tertiary-container: #ffd8e4;
            --md-sys-color-on-tertiary-container: #370b1e;
            --md-sys-color-error: #b3261e;
            --md-sys-color-on-error: #ffffff;
            --md-sys-color-error-container: #f9dedc;
            --md-sys-color-on-error-container: #410e0b;
            --md-sys-color-background: #fffbfe;
            --md-sys-color-on-background: #1c1b1f;

            /* Custom status colors (override Material for clarity) */
            --status-healthy: #2e8b57;
            --status-healthy-bg: #e8f5e9;
            --status-degraded: #ff9800;
            --status-degraded-bg: #fff3e0;
            --status-unhealthy: #c41c3b;
            --status-unhealthy-bg: #ffebee;

            /* Elevation (shadows) */
            --md-elevation-0: none;
            --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.15), 0 1px 3px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-4: 0 5px 10px 4px rgba(0, 0, 0, 0.15), 0 2px 3px 0 rgba(0, 0, 0, 0.30);

            /* Spacing & Shape */
            --md-shape-corner-none: 0;
            --md-shape-corner-extra-small: 4px;
            --md-shape-corner-small: 8px;
            --md-shape-corner-medium: 12px;
            --md-shape-corner-large: 16px;
            --md-shape-corner-extra-large: 28px;

            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark theme */
                --md-sys-color-surface: #1c1b1f;
                --md-sys-color-surface-dim: #0f0d13;
                --md-sys-color-surface-bright: #36313a;
                --md-sys-color-surface-container-lowest: #0f0d13;
                --md-sys-color-surface-container-low: #1d1a23;
                --md-sys-color-surface-container: #2a2630;
                --md-sys-color-surface-container-high: #35303a;
                --md-sys-color-surface-container-highest: #403a44;
                --md-sys-color-on-surface: #e6e1e5;
                --md-sys-color-on-surface-variant: #cac7d0;
                --md-sys-color-outline: #938f99;
                --md-sys-color-outline-variant: #49454e;
                --md-sys-color-scrim: #000000;
                --md-sys-color-inverse-surface: #e6e1e5;
                --md-sys-color-inverse-on-surface: #313033;
                --md-sys-color-inverse-primary: #6750a4;
                --md-sys-color-primary: #d0bcff;
                --md-sys-color-on-primary: #371e55;
                --md-sys-color-primary-container: #4f378a;
                --md-sys-color-on-primary-container: #eaddff;
                --md-sys-color-secondary: #ccc7d8;
                --md-sys-color-on-secondary: #332d41;
                --md-sys-color-secondary-container: #4a4458;
                --md-sys-color-on-secondary-container: #e8def8;
                --md-sys-color-tertiary: #f4afd4;
                --md-sys-color-on-tertiary: #562d3a;
                --md-sys-color-tertiary-container: #6e4452;
                --md-sys-color-on-tertiary-container: #ffd8e4;
                --md-sys-color-error: #f2b8b5;
                --md-sys-color-on-error: #601410;
                --md-sys-color-error-container: #8c1d18;
                --md-sys-color-on-error-container: #f9dedc;
                --md-sys-color-background: #1c1b1f;
                --md-sys-color-on-background: #e6e1e5;

                /* Custom status colors (dark) */
                --status-healthy: #4caf50;
                --status-healthy-bg: #1b5e20;
                --status-degraded: #ffb74d;
                --status-degraded-bg: #e65100;
                --status-unhealthy: #ef5350;
                --status-unhealthy-bg: #b71c1c;

                /* Elevation (dark shadows) */
                --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.60), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
                --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.60), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
                --md-elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.60), 0 1px 3px 0 rgba(0, 0, 0, 0.30);
                --md-elevation-4: 0 5px 10px 4px rgba(0, 0, 0, 0.60), 0 2px 3px 0 rgba(0, 0, 0, 0.30);
            }
        }

        html[data-theme="light"] {
            --md-sys-color-surface: #fffbfe;
            --md-sys-color-surface-dim: #f3eff4;
            --md-sys-color-surface-container: #f1ecf1;
            --md-sys-color-on-surface: #1c1b1f;
            --md-sys-color-on-surface-variant: #49454e;
            --md-sys-color-outline: #79747e;
            --md-sys-color-outline-variant: #cac7d0;
            --md-sys-color-background: #fffbfe;
            --md-sys-color-on-background: #1c1b1f;

            --status-healthy: #2e8b57;
            --status-healthy-bg: #e8f5e9;
            --status-degraded: #ff9800;
            --status-degraded-bg: #fff3e0;
            --status-unhealthy: #c41c3b;
            --status-unhealthy-bg: #ffebee;

            --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.15), 0 1px 3px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-4: 0 5px 10px 4px rgba(0, 0, 0, 0.15), 0 2px 3px 0 rgba(0, 0, 0, 0.30);

            color-scheme: light;
        }

        html[data-theme="dark"] {
            --md-sys-color-surface: #1c1b1f;
            --md-sys-color-surface-dim: #0f0d13;
            --md-sys-color-surface-container: #2a2630;
            --md-sys-color-on-surface: #e6e1e5;
            --md-sys-color-on-surface-variant: #cac7d0;
            --md-sys-color-outline: #938f99;
            --md-sys-color-outline-variant: #49454e;
            --md-sys-color-background: #1c1b1f;
            --md-sys-color-on-background: #e6e1e5;

            --status-healthy: #4caf50;
            --status-healthy-bg: #1b5e20;
            --status-degraded: #ffb74d;
            --status-degraded-bg: #e65100;
            --status-unhealthy: #ef5350;
            --status-unhealthy-bg: #b71c1c;

            --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.60), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.60), 0 1px 2px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.60), 0 1px 3px 0 rgba(0, 0, 0, 0.30);
            --md-elevation-4: 0 5px 10px 4px rgba(0, 0, 0, 0.60), 0 2px 3px 0 rgba(0, 0, 0, 0.30);

            color-scheme: dark;
        }

        /* ===== Base Styles ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Roboto", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ===== Header ===== */
        .header {
            background: var(--md-sys-color-surface-container);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            padding: 16px 0;
            margin-bottom: 24px;
            box-shadow: var(--md-elevation-1);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .header .container {
            padding: 16px 24px;
        }

        .header-layout {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 32px;
            align-items: center;
        }

        .header-info h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--md-sys-color-on-surface);
            letter-spacing: -0.5px;
        }

        .header-info p {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-small);
            padding: 4px;
        }

        .view-button {
            padding: 8px 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            border-radius: 4px;
            transition: all 0.2s;
            line-height: 1;
            white-space: nowrap;
        }

        .view-button:hover {
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface);
        }

        .view-button.active {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .theme-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-small);
            padding: 4px;
        }

        .theme-button {
            padding: 8px 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            border-radius: 4px;
            transition: all 0.2s;
            line-height: 1;
        }

        .theme-button:hover {
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface);
        }

        .theme-button.active {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .refresh-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-small);
            padding: 8px 12px;
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            transition: all 0.2s;
        }

        .refresh-control label {
            cursor: pointer;
            margin: 0;
            font-weight: 500;
        }

        .refresh-control input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .refresh-countdown {
            min-width: 50px;
            text-align: right;
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 600;
            font-family: "Roboto Mono", monospace;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: var(--md-shape-corner-medium);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: var(--md-elevation-1);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: var(--md-elevation-2);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .last-refreshed {
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            text-align: right;
            white-space: nowrap;
            font-weight: 500;
        }

        /* ===== Demo Banner ===== */
        .demo-banner {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 1px solid #fcd34d;
            border-radius: var(--md-shape-corner-medium);
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--md-elevation-1);
        }

        .demo-banner strong {
            font-weight: 600;
        }

        /* ===== Overall Health Summary ===== */
        .health-summary {
            background: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-large);
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: var(--md-elevation-1);
            transition: all 0.3s;
        }

        .health-summary-layout {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 32px;
            align-items: center;
        }

        .health-status-main {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .health-status-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .health-status-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-indicator.healthy {
            background: var(--status-healthy);
        }

        .status-indicator.degraded {
            background: var(--status-degraded);
        }

        .status-indicator.unhealthy {
            background: var(--status-unhealthy);
        }

        .health-metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
        }

        .health-metric {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            background: var(--md-sys-color-surface);
            border-radius: var(--md-shape-corner-small);
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .health-metric-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
        }

        .health-metric-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .health-distribution-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .health-distribution-labels {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .health-distribution-label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .distribution-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .distribution-dot.healthy {
            background: var(--status-healthy);
        }

        .distribution-dot.degraded {
            background: var(--status-degraded);
        }

        .distribution-dot.unhealthy {
            background: var(--status-unhealthy);
        }

        .health-distribution-bar {
            width: 200px;
            height: 8px;
            display: flex;
            border-radius: 4px;
            overflow: hidden;
            background: var(--md-sys-color-surface-container-low);
            gap: 1px;
        }

        .distribution-segment {
            flex: 1;
            transition: all 0.3s;
        }

        .distribution-segment.healthy {
            background: var(--status-healthy);
        }

        .distribution-segment.degraded {
            background: var(--status-degraded);
        }

        .distribution-segment.unhealthy {
            background: var(--status-unhealthy);
        }

        /* ===== View Modes ===== */
        .view-content {
            display: none;
        }

        .view-content.active {
            display: block;
        }

        /* ===== Monitoring Matrix (Grid of Integration Windows) ===== */
        .monitoring-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        @media (min-width: 1600px) {
            .monitoring-matrix {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 1024px) {
            .monitoring-matrix {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .monitoring-matrix {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Integration Window (Card) ===== */
        .integration-window {
            background: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-large);
            padding: 20px;
            box-shadow: var(--md-elevation-2);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .integration-window:hover {
            box-shadow: var(--md-elevation-3);
            transform: translateY(-2px);
            border-color: var(--md-sys-color-outline);
        }

        .integration-window.healthy {
            border-left: 4px solid var(--status-healthy);
        }

        .integration-window.degraded {
            border-left: 4px solid var(--status-degraded);
        }

        .integration-window.unhealthy {
            border-left: 4px solid var(--status-unhealthy);
        }

        .integration-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .integration-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .integration-name {
            font-size: 21px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            line-height: 1.2;
        }

        .integration-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--md-shape-corner-small);
            font-size: 13px;
            font-weight: 600;
            width: fit-content;
        }

        .integration-status.HEALTHY {
            background: var(--status-healthy-bg);
            color: var(--status-healthy);
        }

        .integration-status.DEGRADED {
            background: var(--status-degraded-bg);
            color: var(--status-degraded);
        }

        .integration-status.UNHEALTHY {
            background: var(--status-unhealthy-bg);
            color: var(--status-unhealthy);
        }

        .integration-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .metric-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-value-large {
            font-size: 30px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            line-height: 1;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .metric-row.sub {
            grid-column: 1 / -1;
        }

        .metric-row.sub-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .metric-row.sub-grid .metric-row {
            gap: 2px;
        }

        .metric-row.sub-grid .metric-value-large {
            font-size: 20px;
        }

        .metric-row.sub-grid .metric-label {
            font-size: 11px;
        }

        .metric-secondary {
            font-size: 14px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
        }

        .metric-timestamp {
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            font-family: "Roboto Mono", monospace;
            word-break: break-word;
        }

        .integration-divider {
            height: 1px;
            background: var(--md-sys-color-outline-variant);
            margin: 8px 0;
        }

        .integration-actions {
            display: flex;
            gap: 8px;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px 16px;
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface);
            border-radius: var(--md-shape-corner-medium);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-secondary:hover {
            background: var(--md-sys-color-surface-container-high);
            border-color: var(--md-sys-color-outline);
        }

        /* ===== Expandable Details ===== */
        .expandable-details {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-medium);
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: -8px;
        }

        .expandable-details.expanded {
            max-height: 2000px;
            padding: 16px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        .details-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .details-section:last-child {
            margin-bottom: 0;
        }

        .details-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px;
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-shape-corner-small);
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
        }

        .detail-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .recommendations-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .recommendation-item {
            padding: 12px;
            background: var(--md-sys-color-surface-container-low);
            border-left: 4px solid var(--status-unhealthy);
            border-radius: var(--md-shape-corner-small);
            transition: all 0.2s;
        }

        .recommendation-item.warning {
            border-left-color: var(--status-degraded);
        }

        .recommendation-type {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .recommendation-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
            color: var(--md-sys-color-on-surface);
        }

        .recommendation-desc {
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            line-height: 1.4;
        }

        /* ===== Recent Failures Panel ===== */
        .recent-failures-section {
            background: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-large);
            padding: 24px;
            box-shadow: var(--md-elevation-1);
        }

        .section-header {
            font-size: 20px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 16px;
        }

        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            white-space: nowrap;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-small);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-family: inherit;
        }

        .filter-group select:hover {
            border-color: var(--md-sys-color-outline);
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 3px rgba(103, 80, 164, 0.1);
        }

        .table-wrapper {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-medium);
            overflow: hidden;
            transition: all 0.3s;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--md-sys-color-surface-container-low);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }

        th {
            padding: 16px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            font-size: 14px;
            color: var(--md-sys-color-on-surface);
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--md-sys-color-surface-container-low);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .timestamp-cell {
            font-family: "Roboto Mono", monospace;
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: var(--md-shape-corner-small);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-error {
            background: var(--status-unhealthy-bg);
            color: var(--status-unhealthy);
        }

        .badge-timeout {
            background: var(--status-degraded-bg);
            color: var(--status-degraded);
        }

        /* ===== State Messages ===== */
        .state-message {
            text-align: center;
            padding: 48px 24px;
            color: var(--md-sys-color-on-surface-variant);
            background: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-large);
            box-shadow: var(--md-elevation-1);
        }

        .state-message .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .state-message h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--md-sys-color-on-surface);
        }

        .state-message p {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .error-details {
            margin-top: 12px;
            padding: 12px;
            background: var(--status-unhealthy-bg);
            border-radius: var(--md-shape-corner-small);
            font-size: 13px;
            color: var(--status-unhealthy);
            display: inline-block;
            word-break: break-all;
        }

        /* ===== Spinner ===== */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--md-sys-color-outline-variant);
            border-top-color: var(--md-sys-color-on-surface);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Monitoring Matrix View (Larger Cards) ===== */
        .monitoring-matrix.large-view {
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        }

        @media (min-width: 1600px) {
            .monitoring-matrix.large-view {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .integration-window.large-view {
            padding: 28px;
        }

        .integration-window.large-view .integration-name {
            font-size: 24px;
        }

        .integration-window.large-view .metric-value-large {
            font-size: 36px;
        }

        /* ===== Fullscreen Mode ===== */
        .fullscreen-toggle {
            padding: 8px 12px;
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface);
            border-radius: var(--md-shape-corner-small);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fullscreen-toggle:hover {
            background: var(--md-sys-color-surface-container-low);
        }

        .fullscreen-exit {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: none;
            padding: 10px 16px;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-medium);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--md-elevation-2);
        }

        body.fullscreen-mode .fullscreen-exit {
            display: block;
        }

        body.fullscreen-mode .container {
            padding: 16px;
        }

        body.fullscreen-mode .header {
            display: none;
        }

        /* ===== Responsive Design ===== */
        @media (max-width: 1024px) {
            .header-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .header-controls {
                width: 100%;
            }

            .control-group {
                flex: 1;
                min-width: 100px;
            }

            .health-summary-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .integration-metrics {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header .container {
                padding: 16px;
            }

            .header-info h1 {
                font-size: 24px;
            }

            .health-summary {
                padding: 16px;
            }

            .health-metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .integration-metrics {
                grid-template-columns: 1fr;
            }

            .metric-row.sub-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 12px 8px;
            }

            .integration-window {
                padding: 16px;
            }

            .integration-name {
                font-size: 18px;
            }

            .metric-value-large {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            .header-info h1 {
                font-size: 20px;
            }

            .header-controls {
                gap: 8px;
            }

            .control-group {
                min-width: auto;
            }

            .view-selector, .theme-selector {
                order: -1;
            }

            .health-metrics-grid {
                grid-template-columns: 1fr;
            }

            .integration-metrics {
                grid-template-columns: 1fr;
            }

            .metric-row.sub-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
                flex-direction: column;
            }

            .filter-group select {
                width: 100%;
            }

            th, td {
                padding: 10px 6px;
                font-size: 12px;
            }
        }

<body>
    <div class="header">
        <div class="container">
            <div class="header-layout">
                <div class="header-info">
                    <h1>📊 Integration Monitoring</h1>
                    <p>Enterprise API Health & Performance Analytics</p>
                </div>
                <div class="header-controls">
                    <div class="control-group">
                        <div class="view-selector">
                            <button class="view-button active" id="viewOverview" onclick="switchView('overview')" title="Overview mode">Overview</button>
                            <button class="view-button" id="viewMatrix" onclick="switchView('matrix')" title="Monitoring matrix">Matrix</button>
                            <button class="view-button" id="viewDetailed" onclick="switchView('detailed')" title="Detailed analysis">Detailed</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="theme-selector">
                            <button class="theme-button active" id="themeLight" onclick="setTheme('light')" title="Light theme">☀️</button>
                            <button class="theme-button" id="themeDark" onclick="setTheme('dark')" title="Dark theme">🌙</button>
                            <button class="theme-button" id="themeAuto" onclick="setTheme('auto')" title="System theme">🔄</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="refresh-control">
                            <input type="checkbox" id="autoRefreshToggle" checked>
                            <label for="autoRefreshToggle">Auto</label>
                        </div>
                        <div class="refresh-countdown" id="refreshCountdown">30s</div>
                    </div>
                    <button class="btn-primary" id="refreshBtn" onclick="loadConsole()" title="Refresh data">↻ Refresh</button>
                    <button class="fullscreen-toggle" id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen mode">⛶</button>
                    <div class="last-refreshed" id="lastRefreshed"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="fullscreen-exit" id="fullscreenExit" onclick="exitFullscreen()" title="Exit fullscreen">✕ Exit Fullscreen</button>

    <div class="container">
        <div class="demo-banner">
            ℹ️ <strong>Historical Demo Data:</strong> This dashboard analyzes synthetic request logs. Refreshing reloads the dataset, not live third-party services.
        </div>

        <div id="content">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <script>
        const API_URL = '/api/integrations/console';
        let autoRefreshTimer = null;
        let countdownTimer = null;
        let lastRefreshTime = null;
        let isLoading = false;
        let currentTheme = 'auto';
        let currentView = 'overview';
        let lastData = null;

        /* ===== Theme Management ===== */
        function initTheme() {
            const savedTheme = localStorage.getItem('dashboard-theme') || 'auto';
            setTheme(savedTheme);
        }

        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('dashboard-theme', theme);

            const html = document.documentElement;

            if (theme === 'auto') {
                html.removeAttribute('data-theme');
                updateThemeButtons(theme);
                return;
            }

            html.setAttribute('data-theme', theme);
            updateThemeButtons(theme);
        }

        function updateThemeButtons(theme) {
            document.getElementById('themeLight').classList.toggle('active', theme === 'light');
            document.getElementById('themeDark').classList.toggle('active', theme === 'dark');
            document.getElementById('themeAuto').classList.toggle('active', theme === 'auto');
        }

        /* ===== View Management ===== */
        function switchView(view) {
            currentView = view;
            localStorage.setItem('dashboard-view', view);
            updateViewButtons(view);
            renderContent();
        }

        function updateViewButtons(view) {
            document.getElementById('viewOverview').classList.toggle('active', view === 'overview');
            document.getElementById('viewMatrix').classList.toggle('active', view === 'matrix');
            document.getElementById('viewDetailed').classList.toggle('active', view === 'detailed');
        }

        /* ===== Fullscreen Mode ===== */
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
                document.body.classList.add('fullscreen-mode');
            } else {
                exitFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
            document.body.classList.remove('fullscreen-mode');
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.fullscreenElement) {
                exitFullscreen();
            }
        });

        /* ===== Data Loading ===== */
        async function loadConsole() {
            if (isLoading) return;

            const content = document.getElementById('content');
            const refreshBtn = document.getElementById('refreshBtn');

            isLoading = true;
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<span class="spinner"></span> Loading…';

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status} ${response.statusText}`);
                }

                lastData = await response.json();

                if (!lastData.integrations || lastData.integrations.length === 0) {
                    content.innerHTML = renderEmpty();
                    return;
                }

                lastRefreshTime = Date.now();
                updateLastRefreshed();
                renderContent();

                if (document.getElementById('autoRefreshToggle').checked) {
                    startCountdown();
                }
            } catch (err) {
                content.innerHTML = renderError(err.message);
            } finally {
                isLoading = false;
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '↻ Refresh';
            }
        }

        function renderContent() {
            if (!lastData) return;

            const content = document.getElementById('content');
            let html = '';

            switch (currentView) {
                case 'overview':
                    html = renderOverviewMode(lastData);
                    break;
                case 'matrix':
                    html = renderMatrixMode(lastData);
                    break;
                case 'detailed':
                    html = renderDetailedMode(lastData);
                    break;
            }

            content.innerHTML = html;
            attachEventListeners();
        }

        function renderOverviewMode(data) {
            const s = data.summary;
            const integrations = data.integrations;
            const failures = data.recentFailures || [];

            // Sort integrations by severity
            const sorted = sortIntegrationsBySeverity(integrations);

            let html = renderHealthSummary(s, integrations);
            html += renderMonitoringMatrix(sorted, false);
            html += renderRecentFailuresPanel(failures);

            return html;
        }

        function renderMatrixMode(data) {
            const integrations = data.integrations;
            const sorted = sortIntegrationsBySeverity(integrations);

            let html = `<div class="monitoring-matrix large-view">`;
            for (const ig of sorted) {
                html += renderIntegrationWindow(ig, true);
            }
            html += `</div>`;

            return html;
        }

        function renderDetailedMode(data) {
            const s = data.summary;
            const integrations = data.integrations;
            const failures = data.recentFailures || [];
            const sorted = sortIntegrationsBySeverity(integrations);

            let html = renderHealthSummary(s, integrations);
            html += `<div class="monitoring-matrix">`;
            for (const ig of sorted) {
                html += renderIntegrationWindow(ig, false, true);
            }
            html += `</div>`;
            html += renderRecentFailuresPanel(failures);

            return html;
        }

        function sortIntegrationsBySeverity(integrations) {
            const severityOrder = { UNHEALTHY: 0, DEGRADED: 1, HEALTHY: 2 };
            return [...integrations].sort((a, b) => {
                return (severityOrder[a.status] || 999) - (severityOrder[b.status] || 999);
            });
        }

        function renderHealthSummary(s, integrations) {
            const successRate = s.totalRequests > 0 ? ((s.totalSuccesses / s.totalRequests) * 100).toFixed(1) : '0.0';
            const unsuccessfulRate = (100 - parseFloat(successRate)).toFixed(1);

            const healthyCounts = [s.healthyCount, s.degradedCount, s.unhealthyCount];
            const healthyTotal = s.totalIntegrations || 1;

            let distributionHTML = '';
            for (let i = 0; i < 3; i++) {
                const className = i === 0 ? 'healthy' : i === 1 ? 'degraded' : 'unhealthy';
                const percentage = (healthyCounts[i] / healthyTotal) * 100;
                if (percentage > 0) {
                    distributionHTML += `<div class="distribution-segment ${className}" style="flex: ${percentage};"></div>`;
                }
            }

            const statusEmoji = s.overallStatus === 'HEALTHY' ? '✓' : s.overallStatus === 'DEGRADED' ? '⚠' : '✕';
            const statusClass = s.overallStatus.toLowerCase();

            return `
                <div class="health-summary">
                    <div class="health-summary-layout">
                        <div class="health-status-main">
                            <div class="health-status-label">System Health</div>
                            <div class="health-status-value">
                                <span class="status-indicator ${statusClass}"></span>
                                ${s.overallStatus}
                            </div>
                        </div>

                        <div class="health-metrics-grid">
                            <div class="health-metric">
                                <div class="health-metric-value">${s.healthyCount}</div>
                                <div class="health-metric-label">Healthy</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.degradedCount}</div>
                                <div class="health-metric-label">Degraded</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.unhealthyCount}</div>
                                <div class="health-metric-label">Unhealthy</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalRequests}</div>
                                <div class="health-metric-label">Total Req</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalSuccesses}</div>
                                <div class="health-metric-label">Success</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalErrors}</div>
                                <div class="health-metric-label">Errors</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalTimeouts}</div>
                                <div class="health-metric-label">Timeouts</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${unsuccessfulRate}%</div>
                                <div class="health-metric-label">Unsucc. Rate</div>
                            </div>
                        </div>

                        <div class="health-distribution-container">
                            <div class="health-distribution-labels">
                                <div class="health-distribution-label">
                                    <span class="distribution-dot healthy"></span>
                                    <span>${s.healthyCount}</span>
                                </div>
                                <div class="health-distribution-label">
                                    <span class="distribution-dot degraded"></span>
                                    <span>${s.degradedCount}</span>
                                </div>
                                <div class="health-distribution-label">
                                    <span class="distribution-dot unhealthy"></span>
                                    <span>${s.unhealthyCount}</span>
                                </div>
                            </div>
                            <div class="health-distribution-bar">${distributionHTML}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMonitoringMatrix(integrations, largeView = false) {
            const classNames = largeView ? 'monitoring-matrix large-view' : 'monitoring-matrix';
            let html = `<div class="${classNames}">`;

            for (const ig of integrations) {
                html += renderIntegrationWindow(ig, largeView, false);
            }

            html += `</div>`;
            return html;
        }

        function renderIntegrationWindow(ig, largeView = false, showDetails = false) {
            const successRate = ig.successRate !== null ? ig.successRate.toFixed(1) : '0.0';
            const unsuccessfulRate = ig.unsuccessfulRate !== null ? ig.unsuccessfulRate.toFixed(1) : '0.0';
            const avgLatency = ig.averageLatencyMs !== null ? ig.averageLatencyMs.toFixed(0) : '—';
            const maxLatency = ig.maxLatencyMs > 0 ? ig.maxLatencyMs : '—';
            const latestFailure = ig.latestFailureTimestamp ? formatTime(ig.latestFailureTimestamp) : '—';

            const windowClass = largeView ? 'integration-window large-view' : 'integration-window';
            const statusClass = ig.status.toLowerCase();

            let html = `
                <div class="${windowClass} ${statusClass}">
                    <div class="integration-header">
                        <div class="integration-title">
                            <div class="integration-name">${escapeHtml(ig.integration)}</div>
                            <div class="integration-status ${ig.status}">
                                <span class="status-indicator ${statusClass}"></span>
                                ${ig.status}
                            </div>
                        </div>
                    </div>

                    <div class="integration-metrics">
                        <div class="metric-row">
                            <div class="metric-value-large">${successRate}%</div>
                            <div class="metric-label">Success Rate</div>
                        </div>
                        <div class="metric-row">
                            <div class="metric-value-large">${unsuccessfulRate}%</div>
                            <div class="metric-label">Unsucc. Rate</div>
                        </div>

                        <div class="metric-row sub">
                            <div class="metric-row sub-grid">
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.successCount || 0}</div>
                                    <div class="metric-label">Success</div>
                                </div>
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.errorCount || 0}</div>
                                    <div class="metric-label">Errors</div>
                                </div>
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.timeoutCount || 0}</div>
                                    <div class="metric-label">Timeouts</div>
                                </div>
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.consecutiveFailures || 0}</div>
                                    <div class="metric-label">Consec.</div>
                                </div>
                            </div>
                        </div>

                        <div class="metric-row sub">
                            <div class="metric-secondary">Avg: ${avgLatency}ms | Max: ${maxLatency}ms</div>
                        </div>

                        <div class="metric-row sub">
                            <div class="metric-label">Latest Failure</div>
                            <div class="metric-timestamp">${latestFailure}</div>
                        </div>
                    </div>

                    <div class="integration-divider"></div>

                    <div class="integration-actions">
                        <button class="btn-secondary" onclick="toggleDetails(this)">View Details</button>
                    </div>

                    ${showDetails ? renderExpandedDetails(ig) : `<div class="expandable-details"></div>`}
                </div>
            `;

            return html;
        }

        function renderExpandedDetails(ig) {
            const successRate = ig.successRate !== null ? ig.successRate.toFixed(1) : '0.0';
            const unsuccessfulRate = ig.unsuccessfulRate !== null ? ig.unsuccessfulRate.toFixed(1) : '0.0';

            let html = `<div class="expandable-details expanded">`;

            html += `
                <div class="details-section">
                    <div class="details-section-title">Request Metrics</div>
                    <div class="details-grid">
                        <div class="detail-item">
                            <div class="detail-value">${ig.totalRequests}</div>
                            <div class="detail-label">Total Requests</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${successRate}%</div>
                            <div class="detail-label">Success Rate</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${unsuccessfulRate}%</div>
                            <div class="detail-label">Unsuccessful Rate</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.averageLatencyMs !== null ? ig.averageLatencyMs.toFixed(0) + 'ms' : '—'}</div>
                            <div class="detail-label">Avg Latency</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.maxLatencyMs > 0 ? ig.maxLatencyMs + 'ms' : '—'}</div>
                            <div class="detail-label">Max Latency</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.successCount || 0}</div>
                            <div class="detail-label">Successful</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.errorCount || 0}</div>
                            <div class="detail-label">Errors</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.timeoutCount || 0}</div>
                            <div class="detail-label">Timeouts</div>
                        </div>
                    </div>
                </div>
            `;

            if (ig.latestRequestTimestamp || ig.latestSuccessfulTimestamp || ig.latestFailureTimestamp) {
                html += `
                    <div class="details-section">
                        <div class="details-section-title">Timestamps</div>
                        <div class="details-grid">
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestRequestTimestamp ? formatTime(ig.latestRequestTimestamp) : '—'}</div>
                                <div class="detail-label">Latest Request</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestSuccessfulTimestamp ? formatTime(ig.latestSuccessfulTimestamp) : '—'}</div>
                                <div class="detail-label">Latest Success</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestFailureTimestamp ? formatTime(ig.latestFailureTimestamp) : '—'}</div>
                                <div class="detail-label">Latest Failure</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestStatusCode || '—'}</div>
                                <div class="detail-label">Latest HTTP Code</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (ig.recommendations && ig.recommendations.length > 0) {
                html += `
                    <div class="details-section">
                        <div class="details-section-title">Investigation Recommendations</div>
                        <ul class="recommendations-list">
                            ${ig.recommendations.map(rec => {
                                const cssClass = rec.type.includes('TIMEOUT') || rec.type.includes('429') ? 'warning' : '';
                                return `
                                    <li class="recommendation-item ${cssClass}">
                                        <div class="recommendation-type">${rec.type}</div>
                                        <div class="recommendation-title">${escapeHtml(rec.title)}</div>
                                        <div class="recommendation-desc">${escapeHtml(rec.description)}</div>
                                        <div class="recommendation-desc" style="margin-top: 6px; font-size: 12px;">Last: ${formatTime(rec.lastObserved)}</div>
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    </div>
                `;
            }

            html += `</div>`;
            return html;
        }

        function renderRecentFailuresPanel(failures) {
            if (!failures || failures.length === 0) {
                return `
                    <div class="state-message">
                        <div class="icon">✓</div>
                        <h2>No Recent Failures</h2>
                        <p>All integrations are performing successfully.</p>
                    </div>
                `;
            }

            const uniqueIntegrations = [...new Set(failures.map(f => f.integration))];

            let html = `
                <div class="recent-failures-section">
                    <div class="section-header">Recent Failures</div>
                    <div class="filters">
                        <div class="filter-group">
                            <label for="filterIntegration">Filter by Integration:</label>
                            <select id="filterIntegration" onchange="filterFailures()">
                                <option value="">All Integrations</option>
                                ${uniqueIntegrations.map(ig =>
                                    `<option value="${ig}">${escapeHtml(ig)}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filterStatus">Filter by Status:</label>
                            <select id="filterStatus" onchange="filterFailures()">
                                <option value="">All Statuses</option>
                                <option value="error">Error</option>
                                <option value="timeout">Timeout</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Integration</th>
                                    <th>Status</th>
                                    <th>HTTP Code</th>
                                    <th>Latency</th>
                                    <th>Consecutive</th>
                                </tr>
                            </thead>
                            <tbody id="failures-tbody">
                                ${failures.map(failure => `
                                    <tr class="failure-row" data-integration="${escapeHtml(failure.integration)}" data-status="${failure.status}">
                                        <td class="timestamp-cell">${formatTime(failure.timestamp)}</td>
                                        <td>${escapeHtml(failure.integration)}</td>
                                        <td><span class="badge badge-${failure.status === 'error' ? 'error' : 'timeout'}">${failure.status.toUpperCase()}</span></td>
                                        <td>${failure.statusCode !== null ? failure.statusCode : '—'}</td>
                                        <td>${failure.latencyMs}ms</td>
                                        <td><span class="badge badge-error">#${failure.consecutiveFailureCount}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            return html;
        }

        /* ===== Utility Functions ===== */
        function renderEmpty() {
            return `
                <div class="state-message">
                    <div class="icon">📭</div>
                    <h2>No data available</h2>
                    <p>The dataset is empty. No health metrics to display.</p>
                </div>
            `;
        }

        function renderError(message) {
            return `
                <div class="state-message">
                    <div class="icon">⚠️</div>
                    <h2>Failed to load data</h2>
                    <p>Could not fetch health data from the API.</p>
                    <div class="error-details">${escapeHtml(message)}</div>
                </div>
            `;
        }

        function formatTime(iso8601) {
            try {
                const date = new Date(iso8601);
                return date.toLocaleString('en-US', {
                    month: '2-digit',
                    day: '2-digit',
                    year: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch {
                return iso8601;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateLastRefreshed() {
            if (lastRefreshTime) {
                const date = new Date(lastRefreshTime);
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('lastRefreshed').innerHTML = timeStr;
            }
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            let seconds = 30;
            document.getElementById('refreshCountdown').textContent = seconds + 's';

            countdownTimer = setInterval(() => {
                seconds--;
                document.getElementById('refreshCountdown').textContent = seconds + 's';
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    if (document.getElementById('autoRefreshToggle').checked && !isLoading) {
                        loadConsole();
                    }
                }
            }, 1000);
        }

        function toggleDetails(button) {
            const window = button.closest('.integration-window');
            const details = window.querySelector('.expandable-details');
            const isExpanded = details.classList.contains('expanded');

            if (!isExpanded) {
                const ig = lastData.integrations.find(i => i.integration === window.querySelector('.integration-name').textContent);
                if (ig) {
                    details.innerHTML = renderExpandedDetails(ig).replace(/^<div class="expandable-details expanded">/, '').replace(/<\/div>$/, '');
                }
            }

            details.classList.toggle('expanded');
            button.textContent = isExpanded ? 'View Details' : 'Hide Details';
        }

        function filterFailures() {
            const integrationFilter = document.getElementById('filterIntegration').value;
            const statusFilter = document.getElementById('filterStatus').value;

            document.querySelectorAll('.failure-row').forEach(row => {
                const integration = row.dataset.integration;
                const status = row.dataset.status;
                const matchesIntegration = !integrationFilter || integration === integrationFilter;
                const matchesStatus = !statusFilter || status === statusFilter;
                row.style.display = (matchesIntegration && matchesStatus) ? '' : 'none';
            });
        }

        function attachEventListeners() {
            document.getElementById('autoRefreshToggle').removeEventListener('change', handleAutoRefreshToggle);
            document.getElementById('autoRefreshToggle').addEventListener('change', handleAutoRefreshToggle);
        }

        function handleAutoRefreshToggle(e) {
            if (e.target.checked) {
                startCountdown();
            } else {
                if (countdownTimer) clearInterval(countdownTimer);
                document.getElementById('refreshCountdown').textContent = '—';
            }
        }

        /* ===== Initialize ===== */
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            const savedView = localStorage.getItem('dashboard-view') || 'overview';
            switchView(savedView);
            loadConsole();
        });
    </script>
</body>
</html>
