<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Brightline HR — API Monitoring Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== Design tokens (light / dark / system share one token set) ===== */
      :root {
        --bg: #f4f6fa;
        --surface: #fff;
        --surface-2: #f4f6fa;
        --surface-3: #eaeef5;
        --line: #e2e6ee;
        --line-strong: #c9d0dd;
        --ink: #121826;
        --muted: #566176;
        --accent: #2a52d9;
        --accent-hover: #1f40b5;
        --on-accent: #fff;
        --accent-soft: #e6ecff;
        --ok: #0f6a40;
        --ok-bg: #e4f6ec;
        --ok-dot: #1f9d63;
        --warn: #8a5300;
        --warn-bg: #fff1d6;
        --warn-dot: #e5900a;
        --bad: #b3202f;
        --bad-bg: #fde8ea;
        --bad-dot: #d92d3f;
        --shadow-1: 0 1px 2px rgba(18, 24, 38, 0.05);
        --shadow-2: 0 6px 18px -6px rgba(18, 24, 38, 0.16);
        --shadow-pop: 0 10px 30px -8px rgba(18, 24, 38, 0.28);
        --r-lg: 14px;
        --r-md: 10px;
        --r-sm: 8px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e131c;
          --surface: #151c28;
          --surface-2: #1a2231;
          --surface-3: #222c3d;
          --line: #263044;
          --line-strong: #374560;
          --ink: #e8ecf4;
          --muted: #9aa6bb;
          --accent: #8aa5ff;
          --accent-hover: #a5baff;
          --on-accent: #0b1330;
          --accent-soft: #1f2a4d;
          --ok: #5fd6a0;
          --ok-bg: rgba(52, 211, 153, 0.14);
          --ok-dot: #34d399;
          --warn: #f7bf55;
          --warn-bg: rgba(251, 191, 36, 0.14);
          --warn-dot: #fbbf24;
          --bad: #ff8a93;
          --bad-bg: rgba(248, 113, 113, 0.16);
          --bad-dot: #f87171;
          --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow-2: 0 8px 22px -8px rgba(0, 0, 0, 0.6);
          --shadow-pop: 0 12px 32px -8px rgba(0, 0, 0, 0.7);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e131c;
        --surface: #151c28;
        --surface-2: #1a2231;
        --surface-3: #222c3d;
        --line: #263044;
        --line-strong: #374560;
        --ink: #e8ecf4;
        --muted: #9aa6bb;
        --accent: #8aa5ff;
        --accent-hover: #a5baff;
        --on-accent: #0b1330;
        --accent-soft: #1f2a4d;
        --ok: #5fd6a0;
        --ok-bg: rgba(52, 211, 153, 0.14);
        --ok-dot: #34d399;
        --warn: #f7bf55;
        --warn-bg: rgba(251, 191, 36, 0.14);
        --warn-dot: #fbbf24;
        --bad: #ff8a93;
        --bad-bg: rgba(248, 113, 113, 0.16);
        --bad-dot: #f87171;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-2: 0 8px 22px -8px rgba(0, 0, 0, 0.6);
        --shadow-pop: 0 12px 32px -8px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }

      /* ===== Base ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family:
          "Roboto",
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        transition:
          background 0.25s,
          color 0.25s;
      }
      svg.i {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .skip-link {
        position: absolute;
        left: 12px;
        top: -60px;
        z-index: 2000;
        background: var(--accent);
        color: var(--on-accent);
        padding: 10px 14px;
        border-radius: var(--r-sm);
        font-weight: 600;
        text-decoration: none;
      }
      .skip-link:focus {
        top: 12px;
      }
      .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 28px;
      }

      /* ===== Header ===== */
      .header {
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter: saturate(1.4) blur(10px);
        border-bottom: 1px solid var(--line);
        margin-bottom: 8px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: var(--shadow-1);
      }
      .header .container {
        padding: 14px 28px;
      }
      .header-layout {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: center;
      }
      .header-info {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
        flex: none;
      }
      .brand-mark svg {
        width: 22px;
        height: 22px;
      }
      .header-info h1 {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }
      .header-info p {
        font-size: 13.5px;
        color: var(--muted);
      }
      .header-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .view-selector,
      .theme-selector {
        display: flex;
        gap: 2px;
        background: var(--surface-3);
        border-radius: var(--r-md);
        padding: 3px;
      }
      .view-button,
      .theme-button {
        min-height: 34px;
        padding: 0 14px;
        background: transparent;
        border: 0;
        cursor: pointer;
        font: 600 13.5px/1 inherit;
        font-family: inherit;
        color: var(--muted);
        border-radius: var(--r-sm);
        transition:
          background 0.15s,
          color 0.15s,
          box-shadow 0.15s;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .theme-button {
        padding: 0 10px;
      }
      .view-button:hover,
      .theme-button:hover {
        color: var(--ink);
      }
      .view-button.active,
      .theme-button.active {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 3px rgba(18, 24, 38, 0.18);
      }
      .refresh-control {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: var(--r-md);
        font-size: 13.5px;
        color: var(--muted);
      }
      .refresh-control label {
        cursor: pointer;
        font-weight: 500;
      }
      .refresh-control input {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .refresh-countdown {
        min-width: 36px;
        text-align: right;
        font:
          600 13px "Roboto Mono",
          ui-monospace,
          monospace;
        color: var(--muted);
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 18px;
        background: var(--accent);
        color: var(--on-accent);
        border: 0;
        border-radius: var(--r-md);
        font: 600 14px inherit;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .btn-primary:active:not(:disabled) {
        transform: scale(0.98);
      }
      .btn-primary:disabled {
        opacity: 0.65;
        cursor: progress;
      }
      .btn-primary .spinner {
        border-color: rgba(255, 255, 255, 0.4);
        border-top-color: var(--on-accent);
      }
      .fullscreen-toggle {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: var(--r-md);
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .fullscreen-toggle:hover {
        background: var(--surface-3);
        border-color: var(--line-strong);
      }
      .last-refreshed {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        min-width: 0;
      }
      .last-refreshed:not(:empty)::before {
        content: "Updated ";
      }
      .fullscreen-exit {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
        display: none;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        font: 600 14px inherit;
        font-family: inherit;
        cursor: pointer;
        box-shadow: var(--shadow-pop);
      }
      body.fullscreen-mode .fullscreen-exit {
        display: inline-flex;
      }
      body.fullscreen-mode .container {
        padding: 16px;
      }
      body.fullscreen-mode .header {
        display: none;
      }

      /* ===== Demo banner ===== */
      .demo-banner {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 24px;
        padding: 12px 16px;
        font-size: 14px;
        color: var(--warn);
        background: var(--warn-bg);
        border: 1px solid color-mix(in srgb, var(--warn-dot) 35%, transparent);
        border-radius: var(--r-md);
      }
      .demo-banner svg {
        margin-top: 2px;
      }
      .demo-banner strong {
        font-weight: 600;
      }

      /* ===== Health summary ===== */
      .health-summary {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: var(--shadow-1);
      }
      .health-summary-layout {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: "status dist" "metrics metrics";
        gap: 24px 32px;
        align-items: center;
      }
      .health-status-main {
        grid-area: status;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .health-status-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      .health-status-value {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .status-indicator {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .status-indicator.healthy {
        background: var(--ok-dot);
      }
      .status-indicator.degraded {
        background: var(--warn-dot);
      }
      .status-indicator.unhealthy {
        background: var(--bad-dot);
      }
      .health-status-value .status-indicator {
        width: 14px;
        height: 14px;
      }
      .health-status-value .status-indicator.degraded,
      .health-status-value .status-indicator.unhealthy {
        animation: pulse 2.4s ease-out 3;
      }
      .status-indicator.degraded {
        --pulse: var(--warn-dot);
      }
      .status-indicator.unhealthy {
        --pulse: var(--bad-dot);
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 var(--pulse);
        }
        100% {
          box-shadow: 0 0 0 10px transparent;
        }
      }
      .health-metrics-grid {
        grid-area: metrics;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        overflow: hidden;
      }
      .health-metric {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 14px 16px;
        background: var(--surface);
        min-width: 0;
      }
      .health-metric-value {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .health-metric-label {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
      }
      /* The first three tiles are always Healthy / Degraded / Unhealthy (fixed template order). */
      .health-metric:nth-child(-n + 3) .health-metric-label::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .health-metric:nth-child(1) .health-metric-label::before {
        background: var(--ok-dot);
      }
      .health-metric:nth-child(2) .health-metric-label::before {
        background: var(--warn-dot);
      }
      .health-metric:nth-child(3) .health-metric-label::before {
        background: var(--bad-dot);
      }
      .health-distribution-container {
        grid-area: dist;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
      }
      .health-distribution-labels {
        display: flex;
        gap: 16px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .health-distribution-label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .distribution-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .distribution-dot.healthy,
      .distribution-segment.healthy {
        background: var(--ok-dot);
      }
      .distribution-dot.degraded,
      .distribution-segment.degraded {
        background: var(--warn-dot);
      }
      .distribution-dot.unhealthy,
      .distribution-segment.unhealthy {
        background: var(--bad-dot);
      }
      .health-distribution-bar {
        width: min(320px, 100%);
        height: 10px;
        display: flex;
        border-radius: 999px;
        overflow: hidden;
        background: var(--surface-3);
        gap: 2px;
      }
      .distribution-segment {
        flex: 1;
        min-width: 6px;
        transition: flex 0.4s ease;
      }

      /* ===== Integration columns (JS emits one .integration-column per visible column) ===== */
      .monitoring-matrix {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        align-items: start;
        gap: 20px;
        margin-bottom: 24px;
      }
      .integration-column {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
        min-width: 0;
      }
      .integration-column > .integration-window {
        width: 100%;
        min-width: 0;
        height: fit-content;
      }

      /* ===== Integration card ===== */
      .integration-window {
        --edge: var(--line-strong);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow:
          inset 3px 0 0 var(--edge),
          var(--shadow-1);
        transition:
          box-shadow 0.2s,
          border-color 0.2s;
      }
      .integration-window:hover {
        border-color: var(--line-strong);
        box-shadow:
          inset 3px 0 0 var(--edge),
          var(--shadow-2);
      }
      .integration-window.healthy {
        --edge: var(--ok-dot);
      }
      .integration-window.degraded {
        --edge: var(--warn-dot);
      }
      .integration-window.unhealthy {
        --edge: var(--bad-dot);
      }
      .integration-header {
        display: block;
      }
      .integration-title {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 12px;
      }
      .integration-name {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.005em;
        overflow-wrap: anywhere;
        flex: 1 1 140px;
        min-width: 0;
      }
      .integration-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 11px 4px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .integration-status.HEALTHY {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .integration-status.DEGRADED {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .integration-status.UNHEALTHY {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .integration-metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 14px;
      }
      .metric-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .metric-value-large {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.1;
      }
      .metric-label {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
      }
      .metric-row.sub {
        grid-column: 1 / -1;
      }
      .metric-row.sub-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 12px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
      }
      .metric-row.sub-grid .metric-row {
        gap: 2px;
      }
      .metric-row.sub-grid .metric-value-large {
        font-size: 20px;
      }
      .metric-row.sub-grid .metric-label {
        font-size: 12px;
      }
      .metric-secondary {
        font-size: 14px;
        color: var(--muted);
      }
      .metric-timestamp {
        font:
          13px "Roboto Mono",
          ui-monospace,
          monospace;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .integration-divider {
        height: 1px;
        background: var(--line);
      }
      .integration-actions {
        display: flex;
      }
      .btn-secondary {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        color: var(--ink);
        border-radius: var(--r-md);
        font: 600 14px inherit;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn-secondary:hover {
        background: var(--surface-3);
      }
      .btn-secondary::after {
        content: "";
        width: 7px;
        height: 7px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
        transition: transform 0.2s;
      }
      .btn-secondary[aria-expanded="true"]::after {
        transform: translateY(2px) rotate(-135deg);
      }

      /* ===== Expandable details: hidden via display (no focus leaks, no height jump on neighbours) ===== */
      .expandable-details {
        display: none;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 18px;
        min-width: 0;
      }
      .expandable-details.expanded {
        display: block;
        animation: reveal 0.22s ease-out;
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .details-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }
      .details-section:last-child {
        margin-bottom: 0;
      }
      .details-section-title {
        font-size: 15px;
        font-weight: 600;
        text-transform: capitalize;
      }
      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .detail-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        min-width: 0;
      }
      .detail-value {
        font-size: 16px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .detail-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .recommendations-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .recommendation-item {
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 3px solid var(--bad-dot);
        border-radius: var(--r-sm);
      }
      .recommendation-item.warning {
        border-left-color: var(--warn-dot);
      }
      .recommendation-type {
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 4px;
        overflow-wrap: anywhere;
      }
      .recommendation-title {
        font-weight: 600;
        margin-bottom: 4px;
        font-size: 14.5px;
      }
      .recommendation-desc {
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.55;
      }

      /* ===== Recent failures ===== */
      .recent-failures-section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 24px;
        box-shadow: var(--shadow-1);
      }
      .section-header {
        font-size: 19px;
        font-weight: 600;
        margin-bottom: 16px;
        letter-spacing: -0.005em;
      }
      .filters {
        display: flex;
        gap: 12px 20px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .filter-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .filter-group label {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--muted);
        white-space: nowrap;
      }
      .filter-group select {
        min-height: 38px;
        padding: 0 34px 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-sm);
        background: var(--surface);
        color: var(--ink);
        font: 500 14px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .filter-group select:hover {
        border-color: var(--muted);
      }
      .filter-group select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .table-wrapper {
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        overflow: auto;
        max-height: 540px;
      }
      table {
        width: 100%;
        min-width: 640px;
        border-collapse: separate;
        border-spacing: 0;
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--surface-2);
        padding: 12px 16px;
        text-align: left;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      tbody tr:hover {
        background: var(--surface-2);
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      .timestamp-cell {
        font:
          13px "Roboto Mono",
          ui-monospace,
          monospace;
        color: var(--muted);
        white-space: nowrap;
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .badge-error {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .badge-timeout {
        background: var(--warn-bg);
        color: var(--warn);
      }

      /* ===== States ===== */
      .state-message {
        text-align: center;
        padding: 56px 24px;
        color: var(--muted);
        background: var(--surface);
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-lg);
      }
      .state-message .icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--surface-3);
        color: var(--ink);
      }
      .state-message .icon svg {
        width: 26px;
        height: 26px;
      }
      .state-message h2 {
        font-size: 19px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--ink);
      }
      .error-details {
        margin-top: 14px;
        padding: 10px 14px;
        background: var(--bad-bg);
        border-radius: var(--r-sm);
        font:
          13px "Roboto Mono",
          ui-monospace,
          monospace;
        color: var(--bad);
        display: inline-block;
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--line-strong);
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== Responsive ===== */
      @media (max-width: 1200px) {
        .health-metrics-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 1024px) {
        .header-layout {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .header-controls {
          justify-content: flex-start;
        }
      }
      @media (max-width: 768px) {
        .container,
        .header .container {
          padding: 16px;
        }
        .header {
          position: static;
        }
        .health-summary,
        .recent-failures-section {
          padding: 16px;
        }
        .health-summary-layout {
          grid-template-areas: "status" "dist" "metrics";
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .health-distribution-container {
          align-items: flex-start;
        }
        .health-distribution-labels {
          justify-content: flex-start;
        }
        .health-distribution-bar {
          width: 100%;
        }
        .health-metrics-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .integration-window {
          padding: 18px;
        }
        .details-grid {
          grid-template-columns: 1fr;
        }
        .filter-group {
          flex: 1 1 100%;
          flex-direction: column;
          align-items: stretch;
        }
        .filter-group select {
          width: 100%;
        }
      }
      @media (max-width: 520px) {
        .header-controls {
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 8px;
        }
        .header-controls > .control-group,
        .header-controls > .last-refreshed {
          grid-column: 1 / -1;
        }
        .control-group,
        .view-selector,
        .theme-selector {
          width: 100%;
        }
        .view-button,
        .theme-button {
          flex: 1;
        }
        .control-group {
          justify-content: space-between;
        }
        .header-info h1 {
          font-size: 19px;
        }
        .metric-row.sub-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* ===== Monitoring refinements ===== */
      /* Problem cards get a faint tint so they stand out when scanning a full grid */
      .integration-window.unhealthy {
        background: color-mix(in srgb, var(--bad-dot) 5%, var(--surface));
      }
      .integration-window.degraded {
        background: color-mix(in srgb, var(--warn-dot) 4%, var(--surface));
      }
      /* Success-rate gauge uses the card's own status colour */
      .rate-bar {
        height: 6px;
        border-radius: 999px;
        background: var(--surface-3);
        overflow: hidden;
      }
      .rate-bar > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--edge);
        transition: width 0.5s ease;
      }
      /* Latest failure: label and timestamp share a row to shorten cards */
      .metric-row.sub:has(> .metric-timestamp) {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 2px 12px;
      }
      .metric-row.sub > .metric-secondary {
        font-variant-numeric: tabular-nums;
      }
      /* Loading skeleton while the first response is in flight */
      #content:empty::before {
        content: "";
        display: block;
        height: 360px;
        border-radius: var(--r-lg);
        background: linear-gradient(
          90deg,
          var(--surface-3),
          var(--surface),
          var(--surface-3)
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      /* Wall-display (fullscreen): larger type, full width, clear of the exit button */
      body.fullscreen-mode {
        font-size: 17px;
      }
      body.fullscreen-mode .container {
        max-width: none;
        padding: 68px 24px 24px;
      }
      body.fullscreen-mode .metric-value-large {
        font-size: 34px;
      }
      body.fullscreen-mode .metric-row.sub-grid .metric-value-large {
        font-size: 24px;
      }
      body.fullscreen-mode .health-status-value {
        font-size: 38px;
      }
      body.fullscreen-mode .health-metric-value {
        font-size: 30px;
      }
      body.fullscreen-mode .integration-name {
        font-size: 21px;
      }
      @media print {
        .header,
        .fullscreen-exit,
        .btn-secondary {
          display: none !important;
        }
        .integration-window {
          break-inside: avoid;
        }
      }
      /* ===== Refresh progress, filter empty state ===== */
      .header {
        overflow: visible;
      }
      .refresh-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        overflow: hidden;
        pointer-events: none;
      }
      .refresh-progress span {
        display: block;
        height: 100%;
        background: var(--accent);
        transform-origin: left;
        transform: scaleX(0);
      }
      .refresh-progress.running span {
        animation: countdown 30s linear forwards;
      }
      @keyframes countdown {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
      .filter-empty {
        margin-top: 12px;
        padding: 20px;
        text-align: center;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-md);
      }
      .filter-empty[hidden] {
        display: none;
      }

      /* ===== Responsive pass: phone / tablet / laptop / desktop / large display ===== */
      .container,
      .header .container {
        padding-left: max(28px, env(safe-area-inset-left));
        padding-right: max(28px, env(safe-area-inset-right));
      }
      @media (min-width: 1800px) {
        .container {
          max-width: 2000px;
        }
      }
      @media (min-width: 1025px) and (max-width: 1320px) {
        .header .container {
          padding-top: 12px;
          padding-bottom: 12px;
        }
        .header-layout {
          gap: 12px 20px;
        }
        .header-info p {
          display: none;
        }
        .last-refreshed:not(:empty)::before {
          content: "";
        }
      }
      @media (max-width: 1024px) {
        .health-metrics-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 768px) {
        .container,
        .header .container {
          padding-left: max(16px, env(safe-area-inset-left));
          padding-right: max(16px, env(safe-area-inset-right));
        }
        .filter-group select {
          font-size: 16px;
        }
        .btn-secondary,
        .btn-primary,
        .view-button,
        .theme-button {
          min-height: 44px;
        }
        .view-button,
        .theme-button {
          min-height: 40px;
        }
      }
      /* Failures table becomes stacked cards on phones (labels come from data-label) */
      @media (max-width: 640px) {
        .table-wrapper {
          max-height: none;
          border: 0;
          overflow: visible;
        }
        table {
          min-width: 0;
          display: block;
        }
        thead {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
        }
        tbody {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        tbody tr {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px 12px;
          padding: 14px;
          background: var(--surface);
          border: 1px solid var(--line);
          border-radius: var(--r-md);
        }
        tbody tr:hover {
          background: var(--surface);
        }
        td {
          display: flex;
          flex-direction: column;
          gap: 2px;
          padding: 0;
          border: 0;
          min-width: 0;
          font-size: 14px;
        }
        td::before {
          content: attr(data-label);
          font-size: 12px;
          font-weight: 500;
          color: var(--muted);
        }
        td.timestamp-cell {
          grid-column: 1 / -1;
          white-space: normal;
        }
        td.timestamp-cell::before {
          display: none;
        }
        td .badge {
          align-self: flex-start;
        }
        tbody tr:last-child td {
          border-bottom: 0;
        }
      }
      @media (max-width: 360px) {
        .health-metric {
          padding: 12px;
        }
        .health-metric-value {
          font-size: 21px;
        }
        .metric-value-large {
          font-size: 25px;
        }
        .integration-window {
          padding: 16px;
        }
      }
      @media (max-width: 1024px) {
        .header {
          position: static;
        }
      }
      /* Landscape phones: a sticky header would eat the screen */
      @media (max-height: 520px) {
        .header {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to dashboard</a>
    <header class="header">
      <div class="container">
        <div class="header-layout">
          <div class="header-info">
            <span class="brand-mark" role="img" aria-label="Brightline HR"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 12h4l2.5-6 4 12 2.5-6H21" /></svg
            ></span>
            <div>
              <h1>Integration Monitoring</h1>
              <p>Enterprise API Health &amp; Performance Analytics</p>
            </div>
          </div>
          <div class="header-controls">
            <div class="control-group">
              <div
                class="view-selector"
                role="group"
                aria-label="Dashboard view"
              >
                <button
                  class="view-button active"
                  id="viewOverview"
                  onclick="switchView('overview')"
                  title="Overview mode"
                  aria-pressed="true"
                >
                  Overview
                </button>
                <button
                  class="view-button"
                  id="viewMatrix"
                  onclick="switchView('matrix')"
                  title="Monitoring matrix"
                  aria-pressed="false"
                >
                  Matrix
                </button>
                <button
                  class="view-button"
                  id="viewDetailed"
                  onclick="switchView('detailed')"
                  title="Detailed analysis"
                  aria-pressed="false"
                >
                  Detailed
                </button>
              </div>
            </div>
            <div class="control-group">
              <div class="theme-selector" role="group" aria-label="Color theme">
                <button
                  class="theme-button active"
                  id="themeLight"
                  onclick="setTheme('light')"
                  title="Light theme"
                  aria-label="Light theme"
                  aria-pressed="false"
                >
                  <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                      d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                    />
                  </svg>
                </button>
                <button
                  class="theme-button"
                  id="themeDark"
                  onclick="setTheme('dark')"
                  title="Dark theme"
                  aria-label="Dark theme"
                  aria-pressed="false"
                >
                  <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                  </svg>
                </button>
                <button
                  class="theme-button"
                  id="themeAuto"
                  onclick="setTheme('auto')"
                  title="System theme"
                  aria-label="System theme"
                  aria-pressed="false"
                >
                  <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="12" rx="2" />
                    <path d="M8 20h8M12 16v4" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="control-group">
              <div class="refresh-control">
                <input type="checkbox" id="autoRefreshToggle" checked />
                <label for="autoRefreshToggle">Auto</label>
              </div>
              <div
                class="refresh-countdown"
                id="refreshCountdown"
                title="Time until next automatic refresh"
              >
                30s
              </div>
            </div>
            <button
              class="btn-primary"
              id="refreshBtn"
              onclick="loadConsole()"
              title="Refresh data"
            >
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
              </svg>
              Refresh
            </button>
            <button
              class="fullscreen-toggle"
              id="fullscreenBtn"
              onclick="toggleFullscreen()"
              title="Fullscreen mode"
              aria-label="Fullscreen mode"
            >
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
              </svg>
            </button>
            <div class="last-refreshed" id="lastRefreshed" role="status"></div>
          </div>
        </div>
      </div>
      <div class="refresh-progress" id="refreshProgress" aria-hidden="true">
        <span></span>
      </div>
    </header>

    <button
      class="fullscreen-exit"
      id="fullscreenExit"
      onclick="exitFullscreen()"
      title="Exit fullscreen"
    >
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
      Exit Fullscreen
    </button>

    <div class="container">
      <div class="demo-banner">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5M12 8h.01" />
        </svg>
        <div>
          <strong>Historical Demo Data:</strong> This dashboard analyzes
          synthetic request logs. Refreshing reloads the dataset, not live
          third-party services.
        </div>
      </div>

      <main id="content" tabindex="-1">
        <!-- Populated by JavaScript -->
      </main>
    </div>

    <script>
      const API_URL = "/api/integrations/console";
      const REFRESH_LABEL_HTML =
        '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg> Refresh';
      let autoRefreshTimer = null;
      let countdownTimer = null;
      let lastRefreshTime = null;
      let isLoading = false;
      let currentTheme = "auto";
      let currentView = "overview";
      let lastData = null;

      /* ===== Theme Management ===== */
      function initTheme() {
        const savedTheme = localStorage.getItem("dashboard-theme") || "auto";
        setTheme(savedTheme);
      }

      function setTheme(theme) {
        currentTheme = theme;
        localStorage.setItem("dashboard-theme", theme);

        const html = document.documentElement;

        if (theme === "auto") {
          html.removeAttribute("data-theme");
          updateThemeButtons(theme);
          return;
        }

        html.setAttribute("data-theme", theme);
        updateThemeButtons(theme);
      }

      function updateThemeButtons(theme) {
        document
          .getElementById("themeLight")
          .classList.toggle("active", theme === "light");
        document
          .getElementById("themeLight")
          .setAttribute("aria-pressed", String(theme === "light"));
        document
          .getElementById("themeDark")
          .classList.toggle("active", theme === "dark");
        document
          .getElementById("themeDark")
          .setAttribute("aria-pressed", String(theme === "dark"));
        document
          .getElementById("themeAuto")
          .classList.toggle("active", theme === "auto");
        document
          .getElementById("themeAuto")
          .setAttribute("aria-pressed", String(theme === "auto"));
      }

      /* ===== View Management ===== */
      function switchView(view) {
        currentView = view;
        localStorage.setItem("dashboard-view", view);
        updateViewButtons(view);
        renderContent();
      }

      function updateViewButtons(view) {
        document
          .getElementById("viewOverview")
          .classList.toggle("active", view === "overview");
        document
          .getElementById("viewOverview")
          .setAttribute("aria-pressed", String(view === "overview"));
        document
          .getElementById("viewMatrix")
          .classList.toggle("active", view === "matrix");
        document
          .getElementById("viewMatrix")
          .setAttribute("aria-pressed", String(view === "matrix"));
        document
          .getElementById("viewDetailed")
          .classList.toggle("active", view === "detailed");
        document
          .getElementById("viewDetailed")
          .setAttribute("aria-pressed", String(view === "detailed"));
      }

      /* ===== Fullscreen Mode ===== */
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => {
            console.log("Fullscreen error:", err);
          });
          document.body.classList.add("fullscreen-mode");
        } else {
          exitFullscreen();
        }
      }

      function exitFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
        document.body.classList.remove("fullscreen-mode");
      }

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          document.body.classList.remove("fullscreen-mode");
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.fullscreenElement) {
          exitFullscreen();
        }
      });

      /* ===== Data Loading ===== */
      async function loadConsole() {
        if (isLoading) return;

        const content = document.getElementById("content");
        const refreshBtn = document.getElementById("refreshBtn");

        isLoading = true;
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<span class="spinner"></span> Loading…';

        try {
          const response = await fetch(API_URL);

          if (!response.ok) {
            throw new Error(
              `Server returned ${response.status} ${response.statusText}`,
            );
          }

          lastData = await response.json();

          if (!lastData.integrations || lastData.integrations.length === 0) {
            content.innerHTML = renderEmpty();
            return;
          }

          lastRefreshTime = Date.now();
          updateLastRefreshed();
          renderContent();

          if (document.getElementById("autoRefreshToggle").checked) {
            startCountdown();
          }
        } catch (err) {
          content.innerHTML = renderError(err.message);
        } finally {
          isLoading = false;
          refreshBtn.disabled = false;
          refreshBtn.innerHTML = REFRESH_LABEL_HTML;
        }
      }

      function renderContent() {
        if (!lastData) return;

        const content = document.getElementById("content");
        let html = "";

        switch (currentView) {
          case "overview":
            html = renderOverviewMode(lastData);
            break;
          case "matrix":
            html = renderMatrixMode(lastData);
            break;
          case "detailed":
            html = renderDetailedMode(lastData);
            break;
        }

        content.innerHTML = html;
        attachEventListeners();
      }

      function renderOverviewMode(data) {
        const s = data.summary;
        const integrations = data.integrations;
        const failures = data.recentFailures || [];

        const sorted = sortIntegrationsBySeverity(integrations);

        let html = renderHealthSummary(s, integrations);
        html += renderMonitoringMatrix(sorted, false);
        html += renderRecentFailuresPanel(failures);

        return html;
      }

      function renderMatrixMode(data) {
        const integrations = data.integrations;
        const sorted = sortIntegrationsBySeverity(integrations);

        return renderIntegrationColumns(sorted, false, false);
      }

      function renderDetailedMode(data) {
        const s = data.summary;
        const integrations = data.integrations;
        const failures = data.recentFailures || [];
        const sorted = sortIntegrationsBySeverity(integrations);

        let html = renderHealthSummary(s, integrations);
        html += renderIntegrationColumns(sorted, false, true);
        html += renderRecentFailuresPanel(failures);

        return html;
      }

      function sortIntegrationsBySeverity(integrations) {
        const severityOrder = { UNHEALTHY: 0, DEGRADED: 1, HEALTHY: 2 };
        return [...integrations].sort((a, b) => {
          return (
            (severityOrder[a.status] ?? 999) - (severityOrder[b.status] ?? 999)
          );
        });
      }

      function renderHealthSummary(s, integrations) {
        const successRate =
          s.totalRequests > 0
            ? ((s.totalSuccesses / s.totalRequests) * 100).toFixed(1)
            : "0.0";
        const unsuccessfulRate = (100 - parseFloat(successRate)).toFixed(1);

        const healthyCounts = [
          s.healthyCount,
          s.degradedCount,
          s.unhealthyCount,
        ];
        const healthyTotal = s.totalIntegrations || 1;

        let distributionHTML = "";
        for (let i = 0; i < 3; i++) {
          const className =
            i === 0 ? "healthy" : i === 1 ? "degraded" : "unhealthy";
          const percentage = (healthyCounts[i] / healthyTotal) * 100;
          if (percentage > 0) {
            distributionHTML += `<div class="distribution-segment ${className}" style="flex: ${percentage};"></div>`;
          }
        }

        const statusClass = s.overallStatus.toLowerCase();

        return `
                <div class="health-summary">
                    <div class="health-summary-layout">
                        <div class="health-status-main">
                            <div class="health-status-label">System Health</div>
                            <div class="health-status-value">
                                <span class="status-indicator ${statusClass}"></span>
                                ${s.overallStatus}
                            </div>
                        </div>

                        <div class="health-metrics-grid">
                            <div class="health-metric">
                                <div class="health-metric-value">${s.healthyCount}</div>
                                <div class="health-metric-label">Healthy</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.degradedCount}</div>
                                <div class="health-metric-label">Degraded</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.unhealthyCount}</div>
                                <div class="health-metric-label">Unhealthy</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalRequests}</div>
                                <div class="health-metric-label" title="Total requests">Total Req</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalSuccesses}</div>
                                <div class="health-metric-label">Success</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalErrors}</div>
                                <div class="health-metric-label">Errors</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${s.totalTimeouts}</div>
                                <div class="health-metric-label">Timeouts</div>
                            </div>
                            <div class="health-metric">
                                <div class="health-metric-value">${unsuccessfulRate}%</div>
                                <div class="health-metric-label" title="Unsuccessful rate">Unsucc. Rate</div>
                            </div>
                        </div>

                        <div class="health-distribution-container">
                            <div class="health-distribution-labels">
                                <div class="health-distribution-label">
                                    <span class="distribution-dot healthy"></span>
                                    <span>${s.healthyCount} Healthy</span>
                                </div>
                                <div class="health-distribution-label">
                                    <span class="distribution-dot degraded"></span>
                                    <span>${s.degradedCount} Degraded</span>
                                </div>
                                <div class="health-distribution-label">
                                    <span class="distribution-dot unhealthy"></span>
                                    <span>${s.unhealthyCount} Unhealthy</span>
                                </div>
                            </div>
                            <div class="health-distribution-bar" role="img" aria-label="Integrations by status: ${s.healthyCount} healthy, ${s.degradedCount} degraded, ${s.unhealthyCount} unhealthy">${distributionHTML}</div>
                        </div>
                    </div>
                </div>
            `;
      }

      function renderMonitoringMatrix(integrations, largeView = false) {
        return renderIntegrationColumns(integrations, largeView, false);
      }

      function renderIntegrationColumns(
        integrations,
        largeView = false,
        showDetails = false,
      ) {
        const columnCount =
          window.innerWidth <= 640
            ? 1
            : window.innerWidth >= 1800
              ? 4
              : window.innerWidth <= 1024
                ? 2
                : 3;
        const columns = Array.from({ length: columnCount }, () => []);

        integrations.forEach((integration, index) => {
          columns[index % columnCount].push(integration);
        });

        return `<div class="monitoring-matrix">
                ${columns
                  .map(
                    (column) => `
                    <div class="integration-column">
                        ${column.map((ig) => renderIntegrationWindow(ig, largeView, showDetails)).join("")}
                    </div>
                `,
                  )
                  .join("")}
            </div>`;
      }

      function renderIntegrationWindow(
        ig,
        largeView = false,
        showDetails = false,
      ) {
        const successRate =
          ig.successRate !== null ? ig.successRate.toFixed(1) : "0.0";
        const unsuccessfulRate =
          ig.unsuccessfulRate !== null ? ig.unsuccessfulRate.toFixed(1) : "0.0";
        const avgLatency =
          ig.averageLatencyMs !== null ? ig.averageLatencyMs.toFixed(0) : "—";
        const maxLatency = ig.maxLatencyMs > 0 ? ig.maxLatencyMs : "—";
        const latestFailure = ig.latestFailureTimestamp
          ? formatTime(ig.latestFailureTimestamp)
          : "—";

        const statusClass = ig.status.toLowerCase();
        const cardId = `card-${escapeHtml(ig.integration).replace(/\s+/g, "-")}`;
        const detailsId = `details-${escapeHtml(ig.integration).replace(/\s+/g, "-")}`;

        let html = `
                <div class="integration-window ${statusClass}" id="${cardId}">
                    <div class="integration-header">
                        <div class="integration-title">
                            <div class="integration-name">${escapeHtml(ig.integration)}</div>
                            <div class="integration-status ${ig.status}">
                                <span class="status-indicator ${statusClass}"></span>
                                ${ig.status}
                            </div>
                        </div>
                    </div>

                    <div class="integration-metrics">
                        <div class="metric-row">
                            <div class="metric-value-large">${successRate}%</div>
                            <div class="metric-label">Success Rate</div>
                        </div>
                        <div class="metric-row">
                            <div class="metric-value-large">${unsuccessfulRate}%</div>
                            <div class="metric-label" title="Unsuccessful rate">Unsucc. Rate</div>
                        </div>

                        <div class="metric-row sub"><div class="rate-bar" role="img" aria-label="Success rate ${successRate}%"><span style="width:${successRate}%"></span></div></div>

                        <div class="metric-row sub">
                            <div class="metric-row sub-grid">
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.successCount || 0}</div>
                                    <div class="metric-label">Success</div>
                                </div>
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.errorCount || 0}</div>
                                    <div class="metric-label">Errors</div>
                                </div>
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.timeoutCount || 0}</div>
                                    <div class="metric-label">Timeouts</div>
                                </div>
                                <div class="metric-row">
                                    <div class="metric-value-large">${ig.consecutiveFailures || 0}</div>
                                    <div class="metric-label" title="Consecutive failures">Consec.</div>
                                </div>
                            </div>
                        </div>

                        <div class="metric-row sub">
                            <div class="metric-secondary">Avg: ${avgLatency}ms | Max: ${maxLatency}ms</div>
                        </div>

                        <div class="metric-row sub">
                            <div class="metric-label">Latest Failure</div>
                            <div class="metric-timestamp">${latestFailure}</div>
                        </div>
                    </div>

                    <div class="integration-divider"></div>

                    <div class="integration-actions">
                        <button class="btn-secondary" onclick="toggleCardDetails('${detailsId}', this)" aria-expanded="${showDetails}" aria-controls="${detailsId}">${showDetails ? "Hide Details" : "View Details"}</button>
                    </div>

                    <div class="expandable-details" id="${detailsId}"></div>
                </div>
            `;

        if (showDetails) {
          html = html.replace(
            `<div class="expandable-details" id="${detailsId}"></div>`,
            `<div class="expandable-details expanded" id="${detailsId}">${renderExpandedDetails(
              ig,
            )
              .replace(/^<div class="expandable-details expanded">/, "")
              .replace(/<\/div>$/, "")}</div>`,
          );
        }

        return html;
      }

      function renderExpandedDetails(ig) {
        const successRate =
          ig.successRate !== null ? ig.successRate.toFixed(1) : "0.0";
        const unsuccessfulRate =
          ig.unsuccessfulRate !== null ? ig.unsuccessfulRate.toFixed(1) : "0.0";

        let html = `<div class="expandable-details expanded">`;

        html += `
                <div class="details-section">
                    <div class="details-section-title">Request Metrics</div>
                    <div class="details-grid">
                        <div class="detail-item">
                            <div class="detail-value">${ig.totalRequests}</div>
                            <div class="detail-label">Total Requests</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${successRate}%</div>
                            <div class="detail-label">Success Rate</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${unsuccessfulRate}%</div>
                            <div class="detail-label">Unsuccessful Rate</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.averageLatencyMs !== null ? ig.averageLatencyMs.toFixed(0) + "ms" : "—"}</div>
                            <div class="detail-label">Avg Latency</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.maxLatencyMs > 0 ? ig.maxLatencyMs + "ms" : "—"}</div>
                            <div class="detail-label">Max Latency</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.successCount || 0}</div>
                            <div class="detail-label">Successful</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.errorCount || 0}</div>
                            <div class="detail-label">Errors</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${ig.timeoutCount || 0}</div>
                            <div class="detail-label">Timeouts</div>
                        </div>
                    </div>
                </div>
            `;

        if (
          ig.latestRequestTimestamp ||
          ig.latestSuccessfulTimestamp ||
          ig.latestFailureTimestamp
        ) {
          html += `
                    <div class="details-section">
                        <div class="details-section-title">Timestamps</div>
                        <div class="details-grid">
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestRequestTimestamp ? formatTime(ig.latestRequestTimestamp) : "—"}</div>
                                <div class="detail-label">Latest Request</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestSuccessfulTimestamp ? formatTime(ig.latestSuccessfulTimestamp) : "—"}</div>
                                <div class="detail-label">Latest Success</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestFailureTimestamp ? formatTime(ig.latestFailureTimestamp) : "—"}</div>
                                <div class="detail-label">Latest Failure</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-value">${ig.latestStatusCode || "—"}</div>
                                <div class="detail-label">Latest HTTP Code</div>
                            </div>
                        </div>
                    </div>
                `;
        }

        if (ig.recommendations && ig.recommendations.length > 0) {
          html += `
                    <div class="details-section">
                        <div class="details-section-title">Investigation Recommendations</div>
                        <ul class="recommendations-list">
                            ${ig.recommendations
                              .map((rec) => {
                                const cssClass =
                                  rec.type.includes("TIMEOUT") ||
                                  rec.type.includes("429")
                                    ? "warning"
                                    : "";
                                return `
                                    <li class="recommendation-item ${cssClass}">
                                        <div class="recommendation-type">${rec.type}</div>
                                        <div class="recommendation-title">${escapeHtml(rec.title)}</div>
                                        <div class="recommendation-desc">${escapeHtml(rec.description)}</div>
                                        <div class="recommendation-desc" style="margin-top: 8px; font-size: 13px;">Last: ${formatTime(rec.lastObserved)}</div>
                                    </li>
                                `;
                              })
                              .join("")}
                        </ul>
                    </div>
                `;
        }

        html += `</div>`;
        return html;
      }

      function renderRecentFailuresPanel(failures) {
        if (!failures || failures.length === 0) {
          return `
                    <div class="state-message">
                        <div class="icon"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
                        <h2>No Recent Failures</h2>
                        <p>All integrations are performing successfully.</p>
                    </div>
                `;
        }

        const uniqueIntegrations = [
          ...new Set(failures.map((f) => f.integration)),
        ];

        let html = `
                <div class="recent-failures-section">
                    <div class="section-header">Recent Failures</div>
                    <div class="filters">
                        <div class="filter-group">
                            <label for="filterIntegration">Filter by Integration:</label>
                            <select id="filterIntegration" onchange="filterFailures()">
                                <option value="">All Integrations</option>
                                ${uniqueIntegrations
                                  .map(
                                    (ig) =>
                                      `<option value="${ig}">${escapeHtml(ig)}</option>`,
                                  )
                                  .join("")}
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filterStatus">Filter by Status:</label>
                            <select id="filterStatus" onchange="filterFailures()">
                                <option value="">All Statuses</option>
                                <option value="error">Error</option>
                                <option value="timeout">Timeout</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Integration</th>
                                    <th>Status</th>
                                    <th>HTTP Code</th>
                                    <th>Latency</th>
                                    <th>Consecutive</th>
                                </tr>
                            </thead>
                            <tbody id="failures-tbody">
                                ${failures
                                  .map(
                                    (failure) => `
                                    <tr class="failure-row" data-integration="${escapeHtml(failure.integration)}" data-status="${failure.status}">
                                        <td class="timestamp-cell" data-label="Timestamp">${formatTime(failure.timestamp)}</td>
                                        <td data-label="Integration">${escapeHtml(failure.integration)}</td>
                                        <td data-label="Status"><span class="badge badge-${failure.status === "error" ? "error" : "timeout"}">${failure.status.toUpperCase()}</span></td>
                                        <td data-label="HTTP Code">${failure.statusCode !== null ? failure.statusCode : "—"}</td>
                                        <td data-label="Latency">${failure.latencyMs}ms</td>
                                        <td data-label="Consecutive"><span class="badge badge-error">#${failure.consecutiveFailureCount}</span></td>
                                    </tr>
                                `,
                                  )
                                  .join("")}
                            </tbody>
                        </table>
                    </div>
                    <div class="filter-empty" id="filterEmpty" hidden>No failures match the selected filters. Change or reset a filter to see more.</div>
                </div>
            `;

        return html;
      }

      /* ===== Utility Functions ===== */
      function renderEmpty() {
        return `
                <div class="state-message">
                    <div class="icon"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></svg></div>
                    <h2>No data available</h2>
                    <p>The dataset is empty. No health metrics to display.</p>
                </div>
            `;
      }

      function renderError(message) {
        return `
                <div class="state-message">
                    <div class="icon"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg></div>
                    <h2>Failed to load data</h2>
                    <p>Could not fetch health data from the API.</p>
                    <div class="error-details">${escapeHtml(message)}</div>
                </div>
            `;
      }

      function formatTime(iso8601) {
        try {
          const date = new Date(iso8601);
          return date.toLocaleString("en-US", {
            month: "2-digit",
            day: "2-digit",
            year: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        } catch {
          return iso8601;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function updateLastRefreshed() {
        if (lastRefreshTime) {
          const date = new Date(lastRefreshTime);
          const timeStr = date.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          document.getElementById("lastRefreshed").innerHTML = timeStr;
        }
      }

      function startCountdown() {
        if (countdownTimer) clearInterval(countdownTimer);
        const bar = document.getElementById("refreshProgress");
        if (bar) {
          bar.classList.remove("running");
          void bar.offsetWidth;
          bar.classList.add("running");
        }
        let seconds = 30;
        document.getElementById("refreshCountdown").textContent = seconds + "s";

        countdownTimer = setInterval(() => {
          seconds--;
          document.getElementById("refreshCountdown").textContent =
            seconds + "s";
          if (seconds <= 0) {
            clearInterval(countdownTimer);
            if (
              document.getElementById("autoRefreshToggle").checked &&
              !isLoading
            ) {
              loadConsole();
            }
          }
        }, 1000);
      }

      function toggleCardDetails(detailsId, button) {
        const detailsElement = document.getElementById(detailsId);
        const cardId = detailsElement.closest(".integration-window").id;
        const card = document.getElementById(cardId);
        const ig = lastData.integrations.find(
          (i) =>
            `card-${escapeHtml(i.integration).replace(/\s+/g, "-")}` === cardId,
        );

        if (!detailsElement.classList.contains("expanded")) {
          // Expanding
          if (ig) {
            detailsElement.innerHTML = renderExpandedDetails(ig)
              .replace(/^<div class="expandable-details expanded">/, "")
              .replace(/<\/div>$/, "");
          }
          detailsElement.classList.add("expanded");
          button.textContent = "Hide Details";
          button.setAttribute("aria-expanded", "true");
        } else {
          // Collapsing
          detailsElement.classList.remove("expanded");
          button.textContent = "View Details";
          button.setAttribute("aria-expanded", "false");
        }
      }

      function filterFailures() {
        const integrationFilter =
          document.getElementById("filterIntegration").value;
        const statusFilter = document.getElementById("filterStatus").value;

        document.querySelectorAll(".failure-row").forEach((row) => {
          const integration = row.dataset.integration;
          const status = row.dataset.status;
          const matchesIntegration =
            !integrationFilter || integration === integrationFilter;
          const matchesStatus = !statusFilter || status === statusFilter;
          row.style.display = matchesIntegration && matchesStatus ? "" : "none";
        });
        const emptyMsg = document.getElementById("filterEmpty");
        if (emptyMsg)
          emptyMsg.hidden = Array.from(
            document.querySelectorAll(".failure-row"),
          ).some((r) => r.style.display !== "none");
      }

      function attachEventListeners() {
        document
          .getElementById("autoRefreshToggle")
          .removeEventListener("change", handleAutoRefreshToggle);
        document
          .getElementById("autoRefreshToggle")
          .addEventListener("change", handleAutoRefreshToggle);
      }

      function handleAutoRefreshToggle(e) {
        if (e.target.checked) {
          startCountdown();
        } else {
          if (countdownTimer) clearInterval(countdownTimer);
          document
            .getElementById("refreshProgress")
            ?.classList.remove("running");
          document.getElementById("refreshCountdown").textContent = "—";
        }
      }

      /* ===== Initialize ===== */
      let resizeRenderTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeRenderTimer);
        resizeRenderTimer = setTimeout(() => {
          if (lastData) {
            const expandedIds = Array.from(
              document.querySelectorAll(".expandable-details.expanded"),
            ).map((el) => el.id);
            renderContent();
            expandedIds.forEach((id) => {
              const details = document.getElementById(id);
              const button = details
                ?.closest(".integration-window")
                ?.querySelector(".integration-actions button");
              if (
                details &&
                button &&
                !details.classList.contains("expanded")
              ) {
                toggleCardDetails(id, button);
              }
            });
          }
        }, 150);
      });

      document.addEventListener("DOMContentLoaded", () => {
        initTheme();
        const savedView = localStorage.getItem("dashboard-view") || "overview";
        switchView(savedView);
        loadConsole();
      });
    </script>
  </body>
</html>
